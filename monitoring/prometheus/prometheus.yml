global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: parkai-django
    metrics_path: /metrics
    static_configs:
      - targets:
          - web:8000
        labels:
          application: parkai
          environment: docker

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          environment: docker

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          environment: docker
